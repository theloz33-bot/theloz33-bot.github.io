<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile check</title></head>
<body style="margin:0;background:#111;color:#9f9;font:13px monospace">
<div id="out">running…</div>
<iframe id="f" style="width:390px;height:844px;border:1px solid #444" src="./"></iframe>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');
f.addEventListener('load',()=>{
  setTimeout(()=>{
    try{
      const w=f.contentWindow,d=w.document;
      const lines=[];
      for(const tb of d.querySelectorAll('.tabs button')){
        tb.click();
        const doc=d.documentElement;
        lines.push(tb.dataset.tab+': overflow='+(doc.scrollWidth-doc.clientWidth)+'px, scrollW='+doc.scrollWidth);
        if(tb.dataset.tab==='crop'){
          // switch crop source to first item if present
          const sel=d.getElementById('cropSrc');
          if(sel.options.length>1){sel.selectedIndex=1;sel.dispatchEvent(new w.Event('change'));}
        }
      }
      // back to first tab
      d.querySelector('.tabs button').click();
      lines.push('console errors: '+JSON.stringify(w.__errs));
      out.textContent='MOBILE-CHECK '+lines.join(' | ');
      document.title='MOBILE-CHECK-DONE';
    }catch(e){out.textContent='ERR '+String(e);document.title='MOBILE-CHECK-ERR';}
  },1500);
});
</script></body></html>
